<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>けいさんブロック</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#fff8ec" />
  <link rel="stylesheet" href="../../shared/core.css" />
  <style>
    .levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--u) * 2.5); width: min(900px, 100%); margin: 0 auto; }
    .levels .eg-btn { min-height: calc(var(--u) * 24); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 8px; font-size: clamp(22px, calc(var(--u) * 4.4), 40px); }
    .levels .eg-btn .e { font-size: calc(var(--u) * 7); line-height: 1; display: block; margin-bottom: 6px; }
    .lead { font-size: clamp(22px, calc(var(--u) * 4), 36px); margin: 0 0 calc(var(--u) * 3); text-align: center; }

    .eq { display: flex; align-items: center; gap: .3em; font-size: clamp(40px, calc(var(--u) * 9), 110px); font-weight: 800; line-height: 1; }
    .eq .a { color: var(--block-a); }
    .eq .b { color: var(--block-b); }
    .eq .q { color: var(--accent); min-width: 1em; text-align: center; }
    .eq .q.done { color: var(--block-c); animation: eg-bump .5s; }

    .stage-row { display: flex; align-items: center; justify-content: center; gap: 40px; }
    .stage-row .op { font-size: 64px; font-weight: 800; color: var(--ink-soft); }
    .mul-grid { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .mul-row { display: flex; align-items: center; gap: 10px; }
    .mul-row .tag { font-size: 24px; font-weight: 700; color: var(--ink-soft); min-width: 2.4em; text-align: right; opacity: 0; transition: opacity .3s; }
    .mul-row .tag.on { opacity: 1; color: var(--accent); }
    /* わりざん：ブロックの山 と おさら */
    .div-wrap { display: flex; flex-direction: column; align-items: center; gap: 28px; }
    .div-pile { min-height: 10px; }
    .div-plates { display: grid; gap: 18px; justify-content: center; }
    .plate {
      min-width: calc(var(--size) * 2.4); min-height: calc(var(--size) * 2.4); padding: 14px;
      border-radius: 999px; background: #fff; box-shadow: 0 6px 0 rgba(59,47,42,.12), inset 0 0 0 5px #f1e7dd;
      display: flex; align-items: center; justify-content: center;
    }
    .plate.on { box-shadow: 0 0 0 6px #ffc93c, 0 6px 0 rgba(59,47,42,.12); }
    .plate-in { display: grid; gap: 4px; }
    .hint-btn { font-size: clamp(24px, calc(var(--u) * 4.4), 36px); min-height: 88px; }
  </style>
</head>
<body>
  <main class="eg-main">
    <section id="menu">
      <div id="menu-fit">
        <p class="lead" id="lead"></p>
        <div class="levels" id="levels"></div>
      </div>
    </section>

    <section id="play" class="eg-hidden">
      <div class="eg-play">
        <div id="progress"></div>
        <div class="eq" id="eq"></div>
        <div id="stage"></div>
        <div class="eg-word" id="word"></div>
        <div id="choices"></div>
      </div>
    </section>
  </main>

  <script src="../../shared/core.js"></script>
  <script src="game.js"></script>
</body>
</html>
