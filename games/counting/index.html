<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>かぞえよう</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#fff8ec" />
  <link rel="stylesheet" href="../../shared/core.css" />
  <style>
    .menu { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--u) * 2.5); width: min(960px, 100%); margin: 0 auto; }
    .menu .eg-btn { min-height: calc(var(--u) * 26); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 12px 8px; font-size: clamp(22px, calc(var(--u) * 4.4), 40px); }
    .menu .eg-btn .e { font-size: calc(var(--u) * 10); line-height: 1; display: block; margin-bottom: 4px; }
    .range { display: flex; gap: 16px; justify-content: center; margin-bottom: calc(var(--u) * 3); }
    .range .eg-btn { font-size: clamp(22px, calc(var(--u) * 4), 32px); min-height: 72px; }
    .range .eg-btn.on { background: var(--accent); color: #fff; }

    .big-num { font-size: 120px; font-weight: 800; color: var(--accent); line-height: 1; animation: eg-pop .4s; }
    .listen { font-size: 80px; width: 150px; height: 150px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; line-height: 1; }
    .choice-num { display: block; line-height: 1.05; }
    .eg-block.count-on { outline: 6px solid #ffc93c; outline-offset: 2px; }
    .tap-hint { color: var(--ink-soft); font-size: clamp(18px, calc(var(--u) * 3.4), 26px); text-align: center; }
  </style>
</head>
<body>
  <main class="eg-main">
    <!-- モード選択 -->
    <section id="menu">
      <div id="menu-fit">
        <div class="range" id="range">
          <button class="eg-btn on" data-max="10">1〜10</button>
          <button class="eg-btn" data-max="20">1〜20</button>
        </div>
        <div class="menu">
          <button class="eg-btn" data-mode="howmany"><span class="e">🧱</span>いくつ？<small>How many?</small></button>
          <button class="eg-btn" data-mode="listen"><span class="e">👂</span>えいごで きこう<small>Listen!</small></button>
          <button class="eg-btn" data-mode="tap"><span class="e">👆</span>タップで かぞえる<small>Tap & count</small></button>
        </div>
      </div>
    </section>

    <!-- プレイ画面 -->
    <section id="play" class="eg-hidden">
      <div class="eg-play">
        <div id="progress"></div>
        <div id="stage"></div>
        <div class="eg-word" id="word"></div>
        <div id="choices"></div>
      </div>
    </section>
  </main>

  <script src="../../shared/core.js"></script>
  <script src="game.js"></script>
</body>
</html>
