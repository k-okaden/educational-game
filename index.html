<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>あそびのひろば</title>
  <meta name="theme-color" content="#fff8ec" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="あそびのひろば" />
  <link rel="stylesheet" href="shared/core.css" />
  <style>
    .hub-title { text-align: center; padding: max(20px, env(safe-area-inset-top)) 16px 4px; }
    .hub-title h1 { margin: 0; font-size: clamp(36px, 6vw, 64px); letter-spacing: .05em; }
    .hub-title p { margin: 4px 0 0; color: var(--ink-soft); font-size: clamp(16px, 2.2vw, 22px); }
    .hub-top { display: flex; justify-content: space-between; padding: 0 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr));
      gap: clamp(16px, 3vw, 32px);
      padding: clamp(16px, 3vw, 40px);
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      aspect-ratio: 1 / 1;
      border-radius: 36px;
      background: var(--c);
      color: #fff;
      box-shadow: 0 10px 0 rgba(0,0,0,.18);
      text-decoration: none;
      transition: transform .1s;
      animation: eg-pop .4s backwards;
    }
    .card:active { transform: translateY(6px); box-shadow: 0 4px 0 rgba(0,0,0,.18); }
    .card .emoji { font-size: clamp(64px, 10vw, 110px); line-height: 1; filter: drop-shadow(0 4px 0 rgba(0,0,0,.15)); }
    .card .emoji.sym { font-size: clamp(90px, 14vw, 150px); font-weight: 900; color: #fff; text-shadow: 0 6px 0 rgba(0,0,0,.15); filter: none; }
    .card .t { font-size: clamp(28px, 4vw, 40px); font-weight: 800; text-shadow: 0 3px 0 rgba(0,0,0,.15); }
    .card .s { font-size: clamp(16px, 2vw, 22px); font-weight: 600; opacity: .9; }
    .card .mystars {
      position: absolute; top: 14px; right: 16px;
      background: rgba(255,255,255,.9); color: var(--ink);
      border-radius: 20px; padding: 4px 12px; font-weight: 700; font-size: 18px;
    }

    /* おうちのかたへ（設定） */
    dialog {
      border: none; border-radius: var(--radius); padding: 28px; max-width: 520px; width: calc(100% - 32px);
      font-family: var(--font); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    dialog::backdrop { background: rgba(59,47,42,.4); }
    dialog h2 { margin-top: 0; }
    dialog label { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; font-size: 20px; border-bottom: 1px solid #eee; }
    dialog input[type=checkbox] { width: 32px; height: 32px; }
    dialog input[type=range] { width: 50%; }
    dialog .close { margin-top: 20px; width: 100%; min-height: 64px; font-size: 24px; }
    dialog .danger { background: #ffe3e3; font-size: 18px; min-height: 52px; width: 100%; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="hub-top">
    <div class="eg-stars" id="total">⭐<b>0</b></div>
    <button class="eg-round-btn" id="open-settings" aria-label="おうちのかたへ">⚙️</button>
  </div>
  <div class="hub-title">
    <h1>あそびのひろば</h1>
    <p>どれで あそぶ？</p>
  </div>
  <main class="grid" id="grid"></main>

  <dialog id="settings">
    <h2>おうちのかたへ</h2>
    <label>こうかおん <input type="checkbox" id="s-sound" /></label>
    <label>よみあげ（えいご） <input type="checkbox" id="s-voice" /></label>
    <label>よみあげの はやさ <input type="range" id="s-rate" min="0.5" max="1.2" step="0.05" /></label>
    <button class="eg-btn danger" id="s-reset">ほしを 0 にもどす</button>
    <button class="eg-btn close" id="s-close">とじる</button>
  </dialog>

  <script src="shared/core.js"></script>
  <script src="games/registry.js"></script>
  <script>
    const grid = document.getElementById("grid");
    window.EG_GAMES.filter((g) => !g.hidden).forEach((g, i) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = g.href;
      a.style.setProperty("--c", g.color);
      a.style.animationDelay = i * 70 + "ms";
      a.innerHTML = `<span class="mystars"></span><span class="emoji"></span><span class="t"></span><span class="s"></span>`;
      const ic = a.querySelector(".emoji");
      ic.textContent = g.symbol || g.emoji;
      if (g.symbol) ic.classList.add("sym");
      a.querySelector(".t").textContent = g.title;
      a.querySelector(".s").textContent = g.sub || "";
      const st = EG.stars.get(g.id);
      if (st) a.querySelector(".mystars").textContent = "⭐" + st; else a.querySelector(".mystars").remove();
      a.addEventListener("click", () => EG.sfx.tap());
      grid.appendChild(a);
    });
    document.querySelector("#total b").textContent = EG.stars.get();

    // 設定
    const dlg = document.getElementById("settings");
    const $ = (id) => document.getElementById(id);
    document.getElementById("open-settings").onclick = () => {
      $("s-sound").checked = EG.settings.sound;
      $("s-voice").checked = EG.settings.voice;
      $("s-rate").value = EG.settings.rate;
      dlg.showModal();
    };
    $("s-sound").onchange = (e) => { EG.settings.sound = e.target.checked; EG.saveSettings(); };
    $("s-voice").onchange = (e) => { EG.settings.voice = e.target.checked; EG.saveSettings(); };
    $("s-rate").onchange = (e) => { EG.settings.rate = +e.target.value; EG.saveSettings(); EG.say("one, two, three"); };
    $("s-reset").onclick = () => {
      if (confirm("ほしの記録を消しますか？")) { localStorage.removeItem("eg.stars"); location.reload(); }
    };
    $("s-close").onclick = () => dlg.close();
  </script>
</body>
</html>
